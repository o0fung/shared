[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gait-cycle-analysis"
version = "0.1.0"
description = "Causal walk-state gait cycle segmentation and normalization"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "rich>=14.0",
  "typer>=0.16",
]

[project.scripts]
gait-analyze = "gait_analysis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gait_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
