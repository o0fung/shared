name: Deploy gait data viewer

on:
  push:
    branches:
      - study-gait-pattern
    paths:
      - ".github/workflows/deploy-viewer.yml"
      - "viewer/**"
      - "synchronized_walk.csv"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Assemble an explicit site artifact so the raw recordings and video are
      # never included in the public GitHub Pages deployment.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp viewer/index.html viewer/app.js viewer/styles.css _site/
          cp synchronized_walk.csv _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
